<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darta Logo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0B0C0E; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="darta.js"></script>
<script src="darta-audio.js"></script>
<script>
(async () => {
  // ?opt=1..5 picks the direction, ?w=&h= the size; ?capture hands control to render.mjs
  const q = new URLSearchParams(location.search);
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  canvas.width = Number(q.get('w') || 1920);
  canvas.height = Number(q.get('h') || 1080);
  Darta.setup(canvas.width, canvas.height, Number(q.get('opt') || 1));

  if (q.has('capture')) {
    window.DURATION = Darta.DURATION;
    window.renderAt = (t, samples) => {
      Darta.renderFrame(ctx, t, { samples });
      return canvas.toDataURL('image/png');
    };
    window.renderAudioWav = () => DartaAudio.renderWavBase64();
    window.ready = true;
    return;
  }

  // preview: click to play with sound; it loops
  let buffer = null, ac = null, start = 0, playing = false;
  const draw = t => Darta.renderFrame(ctx, t, { samples: 2 });
  const loop = () => {
    if (!playing) return;
    const t = ac.currentTime - start;
    if (t >= Darta.DURATION) { play(); return; }
    draw(t);
    requestAnimationFrame(loop);
  };
  const play = async () => {
    ac = ac || new AudioContext({ sampleRate: 48000 });
    buffer = buffer || await DartaAudio.render();
    const src = ac.createBufferSource();
    src.buffer = buffer;
    src.connect(ac.destination);
    start = ac.currentTime + 0.05;
    src.start(start);
    playing = true;
    requestAnimationFrame(loop);
  };
  canvas.addEventListener('click', () => { if (!playing) play(); });
  draw(Darta.DURATION);
})();
</script>
</body>
</html>
